<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resurrexi Labs — Coming soon</title>
  <meta name="description" content="Resurrexi Labs — research infrastructure for adversarial systems. Site under reconstruction.">
  <meta name="author" content="Murad Farzulla">
  <meta name="theme-color" content="#13151a">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://resurrexi.io/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://resurrexi.io/">
  <meta property="og:title" content="Resurrexi Labs — Coming soon">
  <meta property="og:description" content="Research infrastructure for adversarial systems. Site under reconstruction.">
  <meta property="og:site_name" content="Resurrexi Labs">

  <style>
    :root {
      --bg: #0d0f14;
      --fg: #e7e7ea;
      --muted: #8a8f99;
      --accent: #b3324b;
      --border: #23262e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #181b22 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: ui-monospace, "JetBrains Mono", "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card { max-width: 560px; width: 100%; text-align: center; }
    .mark {
      font-size: 0.8rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(2rem, 7vw, 3.2rem);
      letter-spacing: 0.06em;
      margin: 0 0 1rem;
      font-weight: 600;
    }
    h1 .accent { color: var(--accent); }
    .lede {
      color: var(--muted);
      line-height: 1.8;
      font-size: 0.95rem;
      margin: 0 auto 2rem;
      max-width: 44ch;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 1.75rem;
    }
    .links a {
      color: var(--fg);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      transition: all 0.2s ease;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    .note { font-size: 0.82rem; color: var(--muted); line-height: 1.7; }
    .note a { color: var(--accent); text-decoration: none; }
    .note a:hover { text-decoration: underline; }
    footer {
      margin-top: 2.5rem;
      font-size: 0.72rem;
      color: #5a5f68;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="mark">Resurrexi Labs</p>
    <h1>Coming <span class="accent">soon</span></h1>
    <p class="lede">Research infrastructure for adversarial systems. The site is being rebuilt — check back shortly.</p>
    <nav class="links">
      <a href="https://dissensus.ai">Dissensus</a>
      <a href="https://farzulla.org">Farzulla Research</a>
      <a href="https://systems.ac">ASCRI</a>
    </nav>
    <p class="note">The ASRI systemic-risk dashboard now lives at <a href="https://asri.dissensus.ai">asri.dissensus.ai</a>.</p>
    <footer>&copy; 2026 Resurrexi Labs · Dissensus Research Ltd</footer>
  </main>
</body>
</html>
